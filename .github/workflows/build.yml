name: Build Minecraft Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Plugin
          path: target/*.jar

      - name: Publish jar as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="plugin-build-${{ github.run_number }}"
          gh release create "$TAG" target/JokerWeapons-*.jar \
            --repo "${{ github.repository }}" \
            --title "Joker Weapons Plugin (build ${{ github.run_number }})" \
            --notes "Paper 1.21.11 plugin. Put the jar in your server's plugins folder." \
            --latest
